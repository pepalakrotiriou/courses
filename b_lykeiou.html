<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Β' Λυκείου — Γλωσσομάθεια & Αλγοριθμική | ΠΕΠΑΛ Ακρωτηρίου</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Outfit:wght@700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f4f6fc;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --accent-purple: #9333ea;
            --accent-teal: #0d9488;
            --accent-amber: #d97706;
            --amber-bg: #fef3c7;
            --code-bg: #0f172a;
            --code-text: #f8fafc;
            --text-main: #1e1b4b;
            --text-muted: #475569;
            --border: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(79, 70, 229, 0.08);
            --shadow-md: 0 10px 20px -5px rgba(79, 70, 229, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.65;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #312e81 0%, #6d28d9 100%);
            color: white;
            padding: 2.75rem 1.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(49, 46, 129, 0.2);
        }

        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 0.45rem 1.1rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 1rem;
            transition: background 0.2s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.15rem;
            opacity: 0.92;
            max-width: 750px;
            margin: 0 auto;
        }

        .teachers-header {
            margin-top: 1.1rem;
            font-size: 0.92rem;
            background: rgba(15, 23, 42, 0.3);
            display: inline-block;
            padding: 0.45rem 1.25rem;
            border-radius: 999px;
        }

        /* Γρήγορη Πλοήγηση Ενοτήτων */
        .toc-bar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0.9rem 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .toc-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
        }

        .toc-link {
            text-decoration: none;
            color: var(--primary);
            background: #eef2ff;
            padding: 0.4rem 0.9rem;
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .toc-link:hover {
            background: var(--primary);
            color: white;
        }

        main.container {
            max-width: 1100px;
            margin: 2.5rem auto;
            padding: 0 1.25rem;
            flex: 1;
            width: 100%;
        }

        .module-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 2.25rem;
            margin-bottom: 2.75rem;
            box-shadow: var(--shadow-sm);
        }

        .step-badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary-dark);
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            margin-bottom: 0.8rem;
        }

        .step-badge.teal { background: #ccfbf1; color: #0f766e; }
        .step-badge.purple { background: #f3e8ff; color: #6b21a8; }
        .step-badge.amber { background: #fef3c7; color: #b45309; }

        .module-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            color: var(--text-main);
            margin-bottom: 1rem;
        }

        .theory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
            gap: 1.1rem;
            margin: 1.25rem 0 1.75rem;
        }

        .var-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 1.15rem;
        }

        .var-box h4 {
            color: var(--primary);
            font-size: 1.05rem;
            margin-bottom: 0.4rem;
        }

        .var-box p {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .var-examples {
            font-size: 0.85rem;
            color: var(--text-main);
            background: #eef2ff;
            padding: 0.45rem 0.65rem;
            border-radius: 8px;
            line-height: 1.55;
        }

        .var-examples code {
            background: #ffffff;
            border: 1px solid #c7d2fe;
            padding: 0.08rem 0.35rem;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.82rem;
            color: #1e1b4b;
            display: inline-block;
            margin: 0.1rem 0.05rem;
        }

        /* Πλαίσιο Καθοδήγησης & Προβληματισμού */
        .challenge-box {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 2px solid #fcd34d;
            border-radius: 14px;
            padding: 1.35rem 1.5rem;
            margin: 1.5rem 0;
        }

        .challenge-box h4 {
            color: #92400e;
            font-size: 1.1rem;
            margin-bottom: 0.45rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .challenge-box p, .challenge-box ul {
            color: #78350f;
            font-size: 0.96rem;
        }

        .challenge-box ul {
            margin-left: 1.3rem;
            margin-top: 0.4rem;
        }

        /* Μπλοκ Κώδικα ΓΛΩΣΣΟΜΑΘΕΙΑ */
        .code-wrapper {
            background: var(--code-bg);
            border-radius: 14px;
            overflow: hidden;
            margin: 1.25rem 0;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
        }

        .code-header {
            background: #1e293b;
            padding: 0.65rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .code-lang {
            color: #94a3b8;
            font-family: 'Fira Code', monospace;
            font-size: 0.82rem;
            font-weight: 600;
        }
